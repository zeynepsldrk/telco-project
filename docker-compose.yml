version: '3.8'

services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: telco_oracle_xe
    ports:
      - "1521:1521"   # Oracle listener port
      - "5500:5500"   # Oracle Enterprise Manager Express
    environment:
      ORACLE_PASSWORD: TelcoPass123   # SYS and SYSTEM password
      APP_USER: telco_user            # Auto-created application user
      APP_USER_PASSWORD: TelcoUser123 # Application user password
    volumes:
      - oracle_data:/opt/oracle/oradata          # Persistent data volume
      - ./init-scripts:/container-entrypoint-initdb.d  # Auto-run SQL scripts
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s   # Oracle XE needs time to initialise
    restart: unless-stopped

volumes:
  oracle_data:
    driver: local